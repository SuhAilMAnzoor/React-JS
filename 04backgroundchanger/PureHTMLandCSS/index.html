<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background Color Changer</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100%;
        height: 100vh;
        background-color: black;
        transition: background-color 0.3s ease;
      }

      .button-container {
        position: fixed;
        bottom: 50px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        padding: 0 10px;
      }

      .button-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        background: white;
        padding: 12px 16px;
        border-radius: 30px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        justify-content: center;
      }

      button {
        border: none;
        outline: none;
        padding: 8px 18px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }

      .red {
        background: red;
        color: white;
      }
      .green {
        background: green;
        color: white;
      }
      .blue {
        background: blue;
        color: white;
      }
      .olive {
        background: olive;
        color: white;
      }
      .gray {
        background: gray;
        color: white;
      }
      .yellow {
        background: yellow;
        color: black;
      }
      .pink {
        background: pink;
        color: white;
      }
      .purple {
        background: purple;
        color: white;
      }
      .lavender {
        background: lavender;
        color: black;
      }
      .white {
        background: white;
        color: black;
        border: 1px solid #ccc;
      }
      .black {
        background: black;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="button-container">
      <div class="button-group">
        <button class="red" onclick="changeColor('red')">Red</button>
        <button class="green" onclick="changeColor('green')">Green</button>
        <button class="blue" onclick="changeColor('blue')">Blue</button>
        <button class="olive" onclick="changeColor('olive')">Olive</button>
        <button class="gray" onclick="changeColor('gray')">Gray</button>
        <button class="yellow" onclick="changeColor('yellow')">Yellow</button>
        <button class="pink" onclick="changeColor('pink')">Pink</button>
        <button class="purple" onclick="changeColor('purple')">Purple</button>
        <button class="lavender" onclick="changeColor('lavender')">
          Lavender
        </button>
        <button class="white" onclick="changeColor('white')">White</button>
        <button class="black" onclick="changeColor('black')">Black</button>
      </div>
    </div>

    <script>
      function changeColor(color) {
        document.body.style.backgroundColor = color;
      }
    </script>
  </body>
</html>
